<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interlock</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  <script type="module" crossorigin src="/assets/index-BqlAudMK.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CguYFMy8.css">
</head>

<body
    class="min-h-screen bg-black text-white font-mono selection:bg-orange-500/30 flex flex-col overflow-hidden relative">

    <!-- Scanline Overlay -->
    <div class="scanline"></div>

    <!-- Header / HUD -->
    <header
        class="flex justify-between items-end border-b border-orange-900/50 p-4 md:px-8 md:py-6 z-10 bg-black/80 backdrop-blur">
        <div>
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Interlock Logo"
                    class="w-10 h-10 object-contain rounded-md border border-neutral-800 bg-neutral-900/50 p-1" />
                <h1 class="text-3xl font-bold tracking-tighter text-white">
                    Interlock <span class="text-orange-500">App</span>
                </h1>
            </div>
            <div class="flex items-center gap-3 mt-2">
                <span
                    class="px-1.5 py-0.5 bg-neutral-800 border border-neutral-700 text-[10px] text-neutral-400 font-bold uppercase">SECURE</span>
                <span
                    class="px-1.5 py-0.5 bg-blue-900/20 border border-blue-500/30 text-[10px] text-blue-400 font-bold uppercase">ENCRYPTED</span>
                <span
                    class="px-1.5 py-0.5 bg-purple-900/20 border border-purple-500/30 text-[10px] text-purple-400 font-bold uppercase">Low
                    Latency</span>
            </div>
        </div>
        <div class="hidden md:block text-right">
            <div class="flex items-center justify-end gap-2 text-orange-500 text-xs font-mono">
                <div class="w-2 h-2 bg-orange-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(249,115,22,0.6)]">
                </div>
                Online
            </div>
            <div class="text-neutral-600 text-[10px] mt-1 font-mono">
                Region: us-central1 | Cloud Run
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 relative overflow-auto z-10 p-4 md:p-8 flex flex-col items-center">

        <!-- Background Grid Decoration -->
        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none"
            style="background-image: radial-gradient(#333 1px, transparent 1px); background-size: 24px 24px;">
        </div>

        <!-- AUTH SECTION -->
        <div id="auth-section" class="w-full max-w-md relative z-10 mt-12 transition-all duration-500">
            <!-- Error Box -->
            <div id="error-msg"
                class="hidden mb-4 p-3 border border-red-500/50 bg-red-900/20 text-red-400 text-xs font-bold font-mono text-center">
                Error: Invalid credentials
            </div>

            <!-- Login Form -->
            <div id="login-form" class="glass-panel p-8 relative group">
                <!-- Corner Accents -->
                <div class="absolute top-0 left-0 w-3 h-3 border-t border-l border-orange-500"></div>
                <div class="absolute top-0 right-0 w-3 h-3 border-t border-r border-orange-500"></div>
                <div class="absolute bottom-0 left-0 w-3 h-3 border-b border-l border-orange-500"></div>
                <div class="absolute bottom-0 right-0 w-3 h-3 border-b border-r border-orange-500"></div>

                <div class="flex flex-col items-center gap-4 mb-6">
                    <div class="p-3 rounded-full border border-orange-500/20 bg-orange-500/10">
                        <i data-lucide="lock" class="text-orange-500 w-6 h-6"></i>
                    </div>
                    <h2 class="text-xl font-bold tracking-tight">Login</h2>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest">Email</label>
                        <input type="email" id="login-email" placeholder="user@example.com"
                            class="retro-input w-full p-3 mt-1 text-sm font-mono placeholder-neutral-700">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••"
                            class="retro-input w-full p-3 mt-1 text-sm font-mono placeholder-neutral-700">
                    </div>
                    <button onclick="login()"
                        class="retro-btn w-full p-3 mt-2 text-xs hover:tracking-wide transition-all">
                        Login
                    </button>
                    <div class="text-center mt-4">
                        <a href="#" onclick="toggleAuth()"
                            class="text-[10px] text-neutral-600 hover:text-orange-500 uppercase tracking-widest transition-colors">
                            Create an account
                        </a>
                    </div>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="glass-panel p-8 relative hidden">
                <div class="absolute top-0 left-0 w-3 h-3 border-t border-l border-blue-500"></div>
                <div class="absolute top-0 right-0 w-3 h-3 border-t border-r border-blue-500"></div>
                <div class="absolute bottom-0 left-0 w-3 h-3 border-b border-l border-blue-500"></div>
                <div class="absolute bottom-0 right-0 w-3 h-3 border-b border-r border-blue-500"></div>

                <div class="flex flex-col items-center gap-4 mb-6">
                    <div class="p-3 rounded-full border border-blue-500/20 bg-blue-500/10">
                        <i data-lucide="user-plus" class="text-blue-500 w-6 h-6"></i>
                    </div>
                    <h2 class="text-xl font-bold tracking-tight">Create Account</h2>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest">Full Name</label>
                        <input type="text" id="reg-name" placeholder="Operator Name"
                            class="retro-input w-full p-3 mt-1 text-sm font-mono placeholder-neutral-700">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest">Email</label>
                        <input type="email" id="reg-email" placeholder="user@example.com"
                            class="retro-input w-full p-3 mt-1 text-sm font-mono placeholder-neutral-700">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest">Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••"
                            class="retro-input w-full p-3 mt-1 text-sm font-mono placeholder-neutral-700">
                    </div>
                    <button onclick="register()"
                        class="retro-btn w-full p-3 mt-2 text-xs border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-black">
                        Sign Up
                    </button>
                    <div class="text-center mt-4">
                        <a href="#" onclick="toggleAuth()"
                            class="text-[10px] text-neutral-600 hover:text-blue-500 uppercase tracking-widest transition-colors">
                            Back to login
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden w-full max-w-4xl relative z-10 transition-all duration-500">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="database" class="text-orange-500 w-5 h-5"></i>
                        Sessions
                    </h2>
                    <p class="text-[10px] text-neutral-500 mt-1 uppercase tracking-widest">Select a session
                    </p>
                </div>
                <button onclick="logout()"
                    class="px-4 py-2 border border-neutral-700 text-neutral-400 text-xs hover:border-red-500 hover:text-red-500 transition-colors bg-black">
                    Log Out
                </button>
            </div>

            <!-- Create New Bar -->
            <div class="flex gap-2 mb-8 items-end">
                <div class="flex-1">
                    <label class="text-[10px] uppercase text-neutral-500 font-bold spacing-widest mb-1 block">New
                        Session</label>
                    <input type="text" id="new-session-title" placeholder="Enter session title..."
                        class="retro-input w-full p-3 text-sm font-mono border-orange-900/50">
                </div>
                <button onclick="createSession()" class="retro-btn h-[46px] px-6 flex items-center gap-2 border-l-0">
                    <i data-lucide="plus-square" class="w-4 h-4"></i>
                    Create
                </button>
            </div>

            <!-- List -->
            <div id="session-list" class="grid gap-2">
                <!-- Items injected here -->
                <div
                    class="p-4 border border-dashed border-neutral-800 text-center text-neutral-600 text-xs uppercase tracking-widest">
                    No active sessions
                </div>
            </div>
        </div>

        <!-- EDITOR SECTION -->
        <div id="editor-section" class="hidden w-full max-w-6xl h-[80vh] flex flex-col relative z-20">
            <!-- Toolbar -->
            <div
                class="flex items-center justify-between bg-neutral-900/80 border border-neutral-800 border-b-0 p-3 backdrop-blur">
                <div class="flex items-center gap-4">
                    <button onclick="showDashboard()"
                        class="text-neutral-500 hover:text-white transition-colors flex items-center gap-2 text-xs uppercase tracking-wider font-bold">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Return
                    </button>
                    <div class="h-4 w-[1px] bg-neutral-700"></div>
                    <input id="editor-title" oninput="handleTitleInput()"
                        class="bg-transparent border-none text-sm font-bold text-orange-500 uppercase tracking-tight focus:outline-none w-64"
                        value="Untitled">
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span id="save-status" class="text-[10px] font-mono text-neutral-500 uppercase">Saved</span>
                        <div id="status-indicator" class="w-1.5 h-1.5 rounded-full bg-neutral-600"></div>
                    </div>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="flex-1 relative border border-neutral-800 bg-black">
                <!-- Line Numbers (Visual Only/Fake) -->
                <div
                    class="absolute left-0 top-0 bottom-0 w-10 bg-neutral-900/50 border-r border-neutral-800 pt-4 flex flex-col items-center gap-[2px] text-[10px] text-neutral-700 font-mono select-none overflow-hidden">
                    <span>01</span><span>02</span><span>03</span><span>04</span><span>05</span>
                    <span>06</span><span>07</span><span>08</span><span>09</span><span>10</span>
                </div>
                <textarea id="editor" oninput="handleInput()"
                    class="w-full h-full bg-transparent text-neutral-300 font-mono p-4 pl-14 text-sm resize-none focus:outline-none leading-relaxed"
                    spellcheck="false"></textarea>
            </div>

            <!-- Footer Info -->
            <div class="border border-neutral-800 border-t-0 bg-neutral-900/50 p-1 flex justify-between px-3">
                <span class="text-[9px] text-neutral-600 font-mono">UTF-8 | LF</span>
                <span class="text-[9px] text-neutral-600 font-mono">MEM: 24MB</span>
            </div>
        </div>

    </main>

</body>

</html>
