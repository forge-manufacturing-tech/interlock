[workspace]

[package]
name = "backend"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "backend-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4", "serde"] }
include_dir = { version = "0.7" }
loco-openapi = { version = "0.1.2" }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "debug"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
futures = { version = "0.3" }
tempfile = { version = "3.10" }

calamine = { version = "0.26" }
rust_xlsxwriter = { version = "0.8" }
csv = { version = "1.3" }
anyhow = "1.0.100"
reqwest = { version = "0.13.1", features = ["json"] }
lopdf = "0.32"
zip = "0.6"
quick-xml = "0.36"
docx-rs = "0.4"
genpdf = "0.2"
image = "0.24"
base64 = "0.22"

[[bin]]
name = "backend-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
reqwest = { version = "0.13.1", features = ["json"] }
